[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sage"
version = "0.1.0"
description = "SAGE — a local terminal AI assistant with task manager, local LLM agent loop, and web search"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sage = "assistant.main:main"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["assistant"]
mypy_path = "src"

[tool.ruff]
src = ["src"]
line-length = 100
